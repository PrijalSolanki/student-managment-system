<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} &middot; {{ error_title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <p class="display-1 fw-bold text-primary mb-0">{{ status_code }}</p>
  <h1 class="h4 mb-3">{{ error_title }}</h1>
  <p class="text-muted mx-auto" style="max-width:38rem">{{ error_message }}</p>
  <div class="d-flex gap-2 justify-content-center mt-4">
    <a class="btn btn-primary" href="/"><i class="bi bi-house me-1"></i>Go to dashboard</a>
    <a class="btn btn-outline-secondary" href="javascript:history.back()"><i class="bi bi-arrow-left me-1"></i>Go back</a>
  </div>
</div>
</body>
</html>
