{% if messages %}
<div class="sms-messages">
  {% for message in messages %}
    <div class="alert alert-{{ message.level_tag|default:'info' }} alert-dismissible fade show" role="alert">
      {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-2"></i>
      {% elif message.tags == 'error' %}<i class="bi bi-exclamation-octagon-fill me-2"></i>
      {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-triangle-fill me-2"></i>
      {% else %}<i class="bi bi-info-circle-fill me-2"></i>{% endif %}
      <span>{{ message }}</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
{% if form.non_field_errors %}
  <div class="alert alert-danger">
    <i class="bi bi-exclamation-octagon-fill me-2"></i>
    {{ form.non_field_errors|join:" " }}
  </div>
{% endif %}
