{% load ui %}
<form method="get" class="sms-filter-bar" data-filter-form>
  {% if search_fields %}
    <div class="sms-filter-search">
      <label class="visually-hidden" for="filter-q">Search</label>
      <input class="form-control form-control-sm" type="search" id="filter-q" name="q"
             value="{{ search_term }}" placeholder="Search&hellip;">
    </div>
  {% endif %}
  {% for name, choices in filter_choices.items %}
    <div class="sms-filter-item">
      <label class="form-label mb-1" for="filter-{{ name }}">{{ name|title }}</label>
      <select class="form-select form-select-sm" id="filter-{{ name }}" name="{{ name }}">
        <option value="">All</option>
        {% for value, label in choices %}
          <option value="{{ value }}" {% if filters|get_item:name == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
  {% endfor %}
  {% if date_range_fields %}
    <div class="sms-filter-item">
      <label class="form-label mb-1" for="filter-from">From</label>
      <input class="form-control form-control-sm" type="date" id="filter-from" name="date_from"
             value="{{ filters.date_from|default:'' }}">
    </div>
    <div class="sms-filter-item">
      <label class="form-label mb-1" for="filter-to">To</label>
      <input class="form-control form-control-sm" type="date" id="filter-to" name="date_to"
             value="{{ filters.date_to|default:'' }}">
    </div>
  {% endif %}
  <div class="sms-filter-actions">
    <button class="btn btn-sm btn-primary" type="submit"><i class="bi bi-funnel me-1"></i>Apply</button>
    <a class="btn btn-sm btn-outline-secondary" href="{{ request.path }}">Reset</a>
  </div>
</form>
{% if has_active_filters %}
  <p class="sms-filter-note"><i class="bi bi-funnel-fill me-1"></i>{{ result_count }} record{{ result_count|pluralize }} match the current filters.</p>
{% endif %}
