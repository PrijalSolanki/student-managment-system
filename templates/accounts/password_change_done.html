{% extends "base.html" %}
{% load ui %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card sms-card border-success-subtle">
      <div class="card-body text-center py-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size:2.6rem"></i>
        <h2 class="h5 mt-3 mb-1">Password updated</h2>
        <p class="text-muted small">Your new password is active and you remain signed in on this device.</p>
        <div class="d-flex gap-2 justify-content-center">
          <a class="btn btn-primary" href="{% url 'accounts:profile' %}">Go to profile</a>
          <a class="btn btn-outline-secondary" href="{% url 'core:dashboard' %}">Dashboard</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
